<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Medprovas</title><style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#6b6a65;--line:#e4e1d8;--accent:#0b6e4f;--bad:#a4441c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#ecebe6;--muted:#a3a19a;--line:#34332f;--accent:#5fc69c;--bad:#f0915f}}
:root[data-theme="dark"]{--bg:#161615;--fg:#ecebe6;--muted:#a3a19a;--line:#34332f;--accent:#5fc69c;--bad:#f0915f}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:420px;margin:12vh auto;padding:0 16px}h1{font-size:1.5rem;margin:0 0 16px}
#changelog{margin-top:32px;border-top:1px solid var(--line)}#changelog h2{font-size:1.1rem;margin:16px 0 4px}
#changelog h3{font-size:.95rem;margin:14px 0 2px}#changelog ul{padding-left:18px;margin:4px 0}#changelog li{margin:3px 0}
input[type=password]{font:inherit;width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit}
button,.link{font:inherit;display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:10px;border:0;border-radius:6px;
background:var(--accent);color:var(--bg);text-align:center;text-decoration:none;cursor:pointer}
label{display:block;margin-top:10px;color:var(--muted);font-size:.9rem}.error{color:var(--bad)}.muted{color:var(--muted)}
</style></head><body><main>
<h1>Medprovas</h1>
<form id=unlock><input type=password id=password placeholder="Senha" autocomplete="current-password" autofocus required>
<label><input type=checkbox id=remember> Lembrar neste aparelho</label>
<button type=submit>Entrar</button><p class=error id=error></p></form>
<nav id=links hidden><a class=link href="deck.html">Slides</a><a class=link href="estudos.html">Temas e questões</a>
<a class=link href="temas.html">Lista de Temas</a>
<button type=button id=pdf>Baixar slides (PDF)</button><p class=muted id=status></p>
<section id=changelog></section></nav>
<script>
const STORE = 'medprovas-key';
function storedKey() { try { return sessionStorage.getItem(STORE) || localStorage.getItem(STORE); } catch (e) { return null; } }
async function importKey(raw) { return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']); }
async function keyFromStore() {
  const b64 = storedKey(); if (!b64) return null;
  return importKey(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
}
async function decrypt(key, blob) {
  const bytes = new Uint8Array(blob);
  return crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes.slice(0, 12)}, key, bytes.slice(12));
}
async function fetchDecrypted(key, url) {
  const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status);
  return decrypt(key, await r.arrayBuffer());
}

const next = new URLSearchParams(location.search).get('next');
async function show(key) {
  await fetchDecrypted(key, 'check.enc');
  if (next && /^(deck|estudos|temas)\.html(#\d+)?$/.test(next)) { location.replace(next); return; }
  unlock.hidden = true; links.hidden = false;
  fetchDecrypted(key, 'changelog.enc').then(data => { changelog.innerHTML = new TextDecoder().decode(data); })
    .catch(() => {});  // no changelog published
  pdf.onclick = async () => {
    status.textContent = 'Baixando…';
    const data = await fetchDecrypted(key, 'deck-pdf.enc');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], {type: 'application/pdf'})); a.download = 'slides.pdf'; a.click();
    status.textContent = '';
  };
}
keyFromStore().then(key => key && show(key).catch(() => {}));
unlock.onsubmit = async e => {
  e.preventDefault(); error.textContent = 'Verificando…';
  const config = await (await fetch('config.json')).json();
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.value), 'PBKDF2', false, ['deriveBits']);
  const raw = new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256',
    salt: Uint8Array.from(atob(config.salt), c => c.charCodeAt(0)), iterations: config.iterations}, material, 256));
  try {
    await show(await importKey(raw));
    const b64 = btoa(String.fromCharCode(...raw));
    try { sessionStorage.setItem(STORE, b64); if (remember.checked) localStorage.setItem(STORE, b64); } catch (e) {}
    error.textContent = '';
  } catch (err) { error.textContent = 'Senha incorreta.'; }
};
</script></main></body></html>
